name: Validate

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same ref supersedes older runs instead of queueing them.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Always the latest stable Flutter release, like the apps that use snacky.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `flutter analyze .` also walks into `example`, which needs its own
      # `pub get` to be analyzed properly.
      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze .

      - name: Test
        run: flutter test

  # The same dry run `publish_to_pubdev.yaml` does before publishing. Any
  # warning makes it exit with code 65, and makes the release fail.
  publish-dry-run:
    name: pub.dev publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish dry run
        run: flutter pub publish --dry-run

  # The analysis pub.dev runs to score the package. Fails when the package
  # loses more points than `--exit-code-threshold` allows (currently the 10
  # points for dartdoc coverage).
  pub-score:
    name: pub.dev score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install pana
        run: dart pub global activate pana

      - name: Score
        run: dart pub global run pana --no-warning --exit-code-threshold 10 .

  example-web:
    name: Example
    uses: ./.github/workflows/build_example_web.yml
