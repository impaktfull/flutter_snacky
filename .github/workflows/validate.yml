name: Validate

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same ref supersedes older runs instead of queueing them.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Always the latest stable Flutter release, like the apps that use snacky.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `flutter analyze .` also walks into `example`, which needs its own
      # `pub get` to be analyzed properly.
      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze .

      - name: Test
        run: flutter test
